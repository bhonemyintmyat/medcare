<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit entry — MedCare</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../admin/css/admin.css">
<link rel="stylesheet" href="css/editor.css">
<!-- Same order as every public page, then the editor set. The guard has
     to run before the page's own script, and everything needs the
     client that supabase.js creates. admin-shell.js is the chrome both
     staff areas share; editor-guard.js publishes itself under the name
     it looks for. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" defer></script>
<script src="../supabase.js" defer></script>
<script src="../auth.js" defer></script>
<script src="../script.js" defer></script>
<script src="js/editor-guard.js" defer></script>
<script src="../admin/js/admin-shell.js" defer></script>
<!-- The allowlist. Shared with the reader side, so what is stored and
     what is shown are cleaned by the same rules. -->
<script src="../sanitize-html.js" defer></script>
<script src="js/editor-api.js" defer></script>
<!-- Wraps Quill, which it fetches from the CDN only when a body
     field is actually on the form. Must load before editor-entry.js,
     which asks it to build the editors. -->
<script src="js/editor-richtext.js" defer></script>
<script src="js/editor-entry.js" defer></script>
</head>
<body>

<!-- Nothing inside .mc-admin-shell is displayed until editor-guard.js
     confirms an editor or an admin: admin.css hides it by default. -->
<div class="mc-admin-shell" id="adminShell">

  <div class="mc-admin-backdrop" data-shell-close></div>

  <!-- ===================== Sidebar ===================== -->
  <aside class="mc-admin-side">
    <a class="mc-admin-brand" href="index.html">
      <span class="mc-logo"><i class="bi bi-heart-pulse-fill"></i></span>
      <span>MedCare<small>Editor</small></span>
    </a>

    <nav class="mc-admin-nav" aria-label="Editor sections">
      <a href="index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect>
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect>
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect>
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect>
        </svg>
        Desk
      </a>

      <div class="mc-admin-nav-label">Write</div>
      <a href="content.html?type=disease">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16.6 3.9a2 2 0 0 1 2.8 2.8L8.2 17.9l-3.7 1 1-3.7z"></path>
          <path d="M14.6 5.9l3.5 3.5"></path>
        </svg>
        Diseases and articles
      </a>
      <a href="content.html?type=hospital">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 20V8.4a1.4 1.4 0 0 1 .8-1.3l6-2.9a1.4 1.4 0 0 1 1.4 0l6 2.9a1.4 1.4 0 0 1 .8 1.3V20"></path>
          <path d="M3 20h18"></path>
          <path d="M12 9.2v4.6M9.7 11.5h4.6"></path>
        </svg>
        Hospitals
      </a>
      <a href="emergency.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.15.38 2.4.58 3.6.58a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.4a1 1 0 0 1 1 1c0 1.25.2 2.45.58 3.6a1 1 0 0 1-.25 1z"></path>
        </svg>
        Emergency numbers
      </a>

      <div class="mc-admin-nav-label">Dress it</div>
      <a href="media.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="14" rx="2"></rect>
          <circle cx="8.6" cy="9.8" r="1.5"></circle>
          <path d="M4 16.5l4.4-4a1.5 1.5 0 0 1 2 0l3.3 3 2.2-1.9a1.5 1.5 0 0 1 2 .05L20 15.4"></path>
        </svg>
        Images
      </a>
      <a href="translations.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 5.4h8.2"></path>
          <path d="M7.6 3.4v2"></path>
          <path d="M9.9 5.4a9.6 9.6 0 0 1-5.3 8.4"></path>
          <path d="M5.4 9.6a8 8 0 0 0 5.5 4.6"></path>
          <path d="M12.4 20.6l4-9.2 4 9.2"></path>
          <path d="M13.9 17.2h5"></path>
        </svg>
        Translations
      </a>

      <div class="mc-admin-nav-label">Moderation</div>
      <a href="reports.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 13.5h4l1.2 2.4h5.6L16 13.5h4"></path>
          <path d="M4 13.5l2.4-7.6a1.6 1.6 0 0 1 1.5-1.1h8.2a1.6 1.6 0 0 1 1.5 1.1L20 13.5v4.4a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 17.9z"></path>
        </svg>
        Reports
      </a>
    </nav>

    <div class="mc-admin-side-foot">
      <a class="mc-auth-btn mc-auth-btn--ghost mc-auth-btn--full" href="../index.html">
        Back to MedCare
      </a>
    </div>
  </aside>

  <!-- ===================== Main ===================== -->
  <div class="mc-admin-main">

    <header class="mc-admin-top">
      <button type="button" class="mc-admin-burger" id="adminBurger"
              aria-label="Show editor sections" aria-expanded="false" aria-controls="adminShell">
        <i class="bi bi-list"></i>
      </button>
      <div>
        <h1>Entry</h1>
        <p class="mc-admin-top-sub">One entry, its Burmese, and the way onto the site.</p>
      </div>
      <div class="mc-admin-top-right">
        <span class="mc-admin-who">
          <i class="bi bi-pencil-square"></i>
          <strong id="adminWho">…</strong>
        </span>
        <button type="button" class="mc-auth-btn mc-auth-btn--ghost" id="adminSignOut">Sign out</button>
      </div>
    </header>

    <main class="mc-admin-content">

      <p class="mc-admin-msg" id="entryMsg" hidden></p>

      <!-- Where this row is in the workflow, and the ways out of it.
           Hidden until a saved row exists: an entry that has never been
           saved has no status to move between. -->
      <section class="mc-ed-workflow" id="workflow" hidden aria-label="Publishing status">
        <div class="mc-ed-workflow-state">
          <span id="workflowPill"></span>
          <span class="mc-ed-workflow-hint" id="workflowHint"></span>
        </div>
        <div class="mc-ed-workflow-acts" id="workflowActs"></div>
      </section>

      <div class="mc-admin-card">
        <h2 id="entryHeading">Entry</h2>
        <p class="mc-admin-hint" id="entrySub"></p>

        <form class="mc-ed-form" id="entryForm" novalidate>
          <!-- Shown instead of a Save button when the row is live and the
               person is not an admin. It carries the one action that
               makes the form editable again, so the explanation and the
               way out are the same element. -->
          <div class="mc-ed-locked" id="entryLocked" hidden>
            <i class="bi bi-lock-fill"></i>
            <div>
              <p id="entryLockedText"></p>
              <button type="button" class="mc-auth-btn mc-auth-btn--ghost" id="entryUnlock">
                <i class="bi bi-eye-slash"></i> Take it off the site to edit
              </button>
            </div>
          </div>

          <div id="fieldHost">
            <div class="mc-skeleton" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>

          <div class="mc-ed-actions">
            <a class="mc-auth-btn mc-auth-btn--ghost" id="entryBack" href="content.html">
              <i class="bi bi-arrow-left"></i> Back to the list
            </a>
            <span class="mc-ed-dirty" id="entryDirty" hidden>
              <i class="bi bi-dot"></i> Unsaved changes
            </span>
            <div class="mc-ed-actions-right">
              <button type="submit" class="mc-auth-btn" id="entrySave">
                <i class="bi bi-check-lg"></i> Save
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Who made this row and who touched it last. Below the form
           rather than in it: it is a fact about the row, not a field. -->
      <p class="mc-touched" id="entryTouched" hidden></p>

    </main>
  </div>
</div>

</body>
</html>
